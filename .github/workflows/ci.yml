name: CI

# Trigger CI rebuild for v125 returnType fixes
on:
  push:
    branches:
      - master
      - dev
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  pull_request:
    branches:
      - master
    paths-ignore:
      - '**/*.md'
      - '**/*.txt'
      - '.editorconfig'
      - '.gitignore'
      - '.idea/**'
      - '**/*.js'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      target_arch:
        description: 'Target architecture to build (arm64-v8a: fast build, saves ~70% NDK compile time; all: full architectures)'
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - arm64-v8a
          - all

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_dispatch' || 
      startsWith(github.ref, 'refs/tags/') ||
      (
        !startsWith(github.event.head_commit.message, '[skip ci]') && 
        (
          github.ref == 'refs/heads/master' ||
          github.ref == 'refs/heads/dev' ||
          github.event_name == 'pull_request'
        )
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: |
            . -> target

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/configuration-cache
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', '**/gradle.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/30.0.14904198
          key: ndk-30.0.14904198-${{ runner.os }}

      - name: Set up Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          NDK_VER=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
          echo "Expected NDK version: $NDK_VER"
          if [ -d "$ANDROID_HOME/ndk/$NDK_VER" ]; then
            echo "NDK $NDK_VER is already installed."
          else
            echo "Installing NDK $NDK_VER via sdkmanager..."
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VER"
          fi

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -qq
          sudo apt install -y gcc-multilib || true

      - name: Build native library
        run: |
          cargo xtask configure
          CFG_FILE="app/src/main/rust/wekit-native/.cargo/config.toml"
          sed -i \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_\([A-Za-z0-9_-]*\) = "--sysroot=\([^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_\1 = "--sysroot=\2 -D__ANDROID_API__=28"|' \
            -e 's|--target=aarch64-linux-android[0-9]*||g' \
            -e 's|--target=x86_64-linux-android[0-9]*||g' \
            -e 's|--target=armv7a-linux-androideabi[0-9]*||g' \
            -e 's|--target=i686-linux-android[0-9]*||g' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "\([^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_aarch64_linux_android = "\1 --target=aarch64-linux-android28"|' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android = "\([^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_x86_64_linux_android = "\1 --target=x86_64-linux-android28"|' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi = "\([^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_armv7_linux_androideabi = "\1 --target=armv7a-linux-androideabi28"|' \
            -e 's|BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android = "\([^"]*\)"|BINDGEN_EXTRA_CLANG_ARGS_i686_linux_android = "\1 --target=i686-linux-android28"|' \
            "$CFG_FILE" || true
          grep 'BINDGEN_EXTRA' "$CFG_FILE" || true

          TARGET_ARCH="${{ inputs.target_arch }}"
          if [ -z "$TARGET_ARCH" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              TARGET_ARCH="all"
            else
              TARGET_ARCH="arm64-v8a"
            fi
          fi
          echo "Selected target architecture: $TARGET_ARCH"

          if [ "$TARGET_ARCH" = "arm64-v8a" ]; then
            echo "Building native library for arm64-v8a only (fast build)..."
            cargo xtask build --native-only --abi arm64-v8a
          else
            echo "Building native library for all architectures..."
            cargo xtask build --native-only
          fi

      - name: Prepare keystore
        if: github.event_name != 'pull_request'
        run: |
          KS_FILE="$RUNNER_TEMP/wekit-keystore.jks"
          CRED_FILE="$RUNNER_TEMP/keystore-creds.env"

          # ── 1. Decode project keystore from GitHub Secrets if available ──
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::group::Decoding project keystore from Secrets"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS_FILE"
            KS_SIZE=$(stat -c%s "$KS_FILE" 2>/dev/null || echo 0)
            echo "Keystore file size: ${KS_SIZE} bytes"

            if [ "$KS_SIZE" -ge 100 ]; then
              # Try PKCS12 first, then JKS
              KS_LOADED=false
              for STORE_TYPE in PKCS12 JKS; do
                if keytool -list -keystore "$KS_FILE" \
                     -storetype "$STORE_TYPE" \
                     -storepass "${{ secrets.STORE_PASSWORD }}" \
                     -alias "${{ secrets.KEY_ALIAS }}" >/dev/null 2>&1; then
                  echo "Keystore loaded successfully (type=${STORE_TYPE})"
                  KS_LOADED=true
                  break
                fi
              done

              if [ "$KS_LOADED" = true ]; then
                echo "Using project keystore from GitHub Secrets."
                echo "KS_PASS=${{ secrets.STORE_PASSWORD }}" > "$CRED_FILE"
                echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$CRED_FILE"
                echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$CRED_FILE"
                cp "$KS_FILE" "$RUNNER_TEMP/release.jks" 2>/dev/null || true
                keytool -list -keystore "$KS_FILE" \
                  -storepass "${{ secrets.STORE_PASSWORD }}" \
                  -alias "${{ secrets.KEY_ALIAS }}" 2>&1 | head -5
                echo "::endgroup::"
                exit 0
              fi
              echo "::warning::Project keystore from Secrets could not be read. Falling back to auto-generated keystore."
            else
              echo "::warning::Decoded keystore is too small (${KS_SIZE} bytes). Falling back to auto-generated keystore."
            fi
            echo "::endgroup::"
          fi

          # ── 2. Fallback: Auto-generate temporary self-signed keystore ──
          # 适用于个人 Fork 仓库或未配置 Secrets 环境，确保 100% 成功生成已签名且手机可直接安装的 Release APK
          echo "::group::Generating temporary self-signed keystore (fallback)"
          echo "Secrets.KEYSTORE_BASE64 is empty or unconfigured."
          echo "Auto-generating release keystore via keytool for fork build compatibility..."
          TEMP_PASS="wcx-store-pass"
          TEMP_ALIAS="wcx"

          keytool -genkeypair -v \
            -keystore "$KS_FILE" \
            -alias "$TEMP_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$TEMP_PASS" \
            -keypass "$TEMP_PASS" \
            -dname "CN=WCX Release, OU=WCX, O=WCX, L=Unknown, ST=Unknown, C=CN"

          cp "$KS_FILE" "$RUNNER_TEMP/release.jks" 2>/dev/null || true

          echo "KS_PASS=$TEMP_PASS" > "$CRED_FILE"
          echo "KEY_ALIAS=$TEMP_ALIAS" >> "$CRED_FILE"
          echo "KEY_PASS=$TEMP_PASS" >> "$CRED_FILE"
          echo "Temporary release keystore generated successfully at $KS_FILE"
          keytool -list -keystore "$KS_FILE" \
            -storepass "$TEMP_PASS" \
            -alias "$TEMP_ALIAS" 2>&1 | head -5
          echo "::endgroup::"

      - name: Build Release (Signed)
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEKIT_KEYSTORE_FILE: ${{ runner.temp }}/wekit-keystore.jks
        run: |
          source "$RUNNER_TEMP/keystore-creds.env"
          export WEKIT_KEYSTORE_PASSWORD="$KS_PASS"
          export WEKIT_KEY_ALIAS="$KEY_ALIAS"
          export WEKIT_KEY_PASSWORD="$KEY_PASS"
          ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Build Release (Unsigned)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assembleRelease --warning-mode all --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist/apk
          TARGET_ARCH="${{ inputs.target_arch }}"
          if [ -z "$TARGET_ARCH" ]; then
            if [ "${{ startsWith(github.ref, 'refs/tags/') }}" = "true" ]; then
              TARGET_ARCH="all"
            else
              TARGET_ARCH="arm64-v8a"
            fi
          fi

          if [ "$TARGET_ARCH" = "arm64-v8a" ]; then
            echo "Collecting arm64-v8a APKs..."
            find app/build/outputs/apk -type f -name '*arm64-v8a*.apk' -exec cp -v {} dist/apk/ \;
            if [ -z "$(ls -A dist/apk 2>/dev/null)" ]; then
              echo "No files matched *arm64-v8a*.apk, collecting all release APKs..."
              find app/build/outputs/apk -type f -name '*.apk' -exec cp -v {} dist/apk/ \;
            fi
          else
            echo "Collecting all APKs..."
            find app/build/outputs/apk -type f -name '*.apk' -exec cp -v {} dist/apk/ \;
          fi
          echo "Collected APKs:"
          ls -1 dist/apk

      - name: Verify APK signatures
        if: github.event_name != 'pull_request'
        run: |
          source "$RUNNER_TEMP/keystore-creds.env"
          EXPECTED=$(keytool -list -v \
            -keystore "$RUNNER_TEMP/wekit-keystore.jks" \
            -storepass "$KS_PASS" \
            -alias "$KEY_ALIAS" 2>/dev/null \
            | grep -iE 'SHA256:' | head -1 | sed 's/.*SHA256:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Expected cert SHA-256: $EXPECTED"
          if [ -z "$EXPECTED" ]; then
            echo "::error::无法从 keystore 读取证书指纹（密码或别名有误？）"
            exit 1
          fi
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          [ -n "$APKSIGNER" ] || APKSIGNER="apksigner"
          echo "apksigner: $APKSIGNER"
          FAIL=0
          for f in dist/apk/*.apk; do
            [ -f "$f" ] || continue
            ACTUAL=$("$APKSIGNER" verify --print-certs "$f" 2>/dev/null | grep -iE 'certificate SHA-256 digest' | head -1 | sed 's/.*digest:[[:space:]]*//' | tr -d ':' | tr 'A-F' 'a-f')
            echo "  $f -> $ACTUAL"
            if [ "$ACTUAL" != "$EXPECTED" ]; then
              echo "::error::APK 签名与预期签名不一致：$f"
              FAIL=1
            fi
          done
          if [ "$FAIL" != "0" ]; then
            echo "::error::存在非预期签名的 APK，拒绝发布。"
            exit 1
          fi
          echo "All APK signatures match the keystore."

      - name: Collect mappings
        run: |
          mkdir -p dist/mapping
          for m in app/build/outputs/mapping/*/mapping.txt; do
            flavorDir=$(basename "$(dirname "$m")")
            cp -v "$m" "dist/mapping/mapping-${flavorDir}.txt"
          done
          ls -1 dist/mapping || echo "(no mappings)"

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: wcx-apk
          path: dist/apk/*.apk
          if-no-files-found: error

      - name: Upload Release Obfuscation Mapping
        uses: actions/upload-artifact@v4
        with:
          name: wcx-mapping
          path: dist/mapping/*.txt
          if-no-files-found: warn

  release:
    needs: build
    runs-on: ubuntu-latest
    if: ${{ success() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/')) }}
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: wcx-apk
          path: artifacts

      - name: Generate version info
        id: version
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          # 版本号单一数据源：直接从 app/build.gradle.kts 读取，
          # 避免 CI 与 APK 版本号漂移；发版时只改 build.gradle.kts
          VERSION_CODE=$(grep -oE 'versionCode[[:space:]]*=[[:space:]]*[0-9]+' app/build.gradle.kts | grep -oE '[0-9]+$')
          VERSION_NAME=$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | grep -oE '"[^"]+"$' | tr -d '"')
          VERSION_TAG="v${VERSION_CODE}"
          echo "tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "hash=${GIT_HASH}" >> $GITHUB_OUTPUT
          echo "count=${VERSION_CODE}" >> $GITHUB_OUTPUT

          cat > artifacts/update.json <<EOF
          {
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_TAG}",
            "commit": "${GIT_HASH}"
          }
          EOF

          echo "Generated update.json:"
          cat artifacts/update.json

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "prev_tag=" >> $GITHUB_OUTPUT
            echo "changelog=首次发布" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "prev_tag=${PREV_TAG}" >> $GITHUB_OUTPUT

          COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" || echo "")

          FEATURES=""
          FIXES=""
          REMOVED=""
          OTHER=""

          while IFS= read -r line; do
            msg=$(echo "$line" | sed 's/^- //')
            if echo "$msg" | grep -qiE "^(feat|新增|添加|增加|实现)"; then
              FEATURES="${FEATURES}- ${msg}"$'\n'
            elif echo "$msg" | grep -qiE "^(fix|修复|bug|解决|修)"; then
              FIXES="${FIXES}- ${msg}"$'\n'
            elif echo "$msg" | grep -qiE "^(remove|删除|移除|去掉)"; then
              REMOVED="${REMOVED}- ${msg}"$'\n'
            else
              OTHER="${OTHER}- ${msg}"$'\n'
            fi
          done <<< "$COMMITS"

          CHANGELOG=""

          if [ -n "$FEATURES" ]; then
            CHANGELOG="${CHANGELOG}### 🎉 新增功能"$'\n'
            CHANGELOG="${CHANGELOG}${FEATURES}"$'\n'
          fi

          if [ -n "$FIXES" ]; then
            CHANGELOG="${CHANGELOG}### 🐛 修复问题"$'\n'
            CHANGELOG="${CHANGELOG}${FIXES}"$'\n'
          fi

          if [ -n "$REMOVED" ]; then
            CHANGELOG="${CHANGELOG}### 🗑️ 移除功能"$'\n'
            CHANGELOG="${CHANGELOG}${REMOVED}"$'\n'
          fi

          if [ -n "$OTHER" ]; then
            CHANGELOG="${CHANGELOG}### 🔧 其他改进"$'\n'
            CHANGELOG="${CHANGELOG}${OTHER}"$'\n'
          fi

          if [ -z "$CHANGELOG" ]; then
            CHANGELOG="暂无详细更新记录"
          fi

          echo "$CHANGELOG" > artifacts/CHANGELOG.md
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

          echo "Generated changelog:"
          cat artifacts/CHANGELOG.md

      - name: Create Release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: WCX ${{ steps.version.outputs.tag }}
          body: |
            ## WCX ${{ steps.version.outputs.tag }}

            正式发行版本

            提交 SHA: `${{ steps.version.outputs.hash }}`

            ${{ steps.changelog.outputs.changelog }}

            ### 📦 下载
            - 下方 Assets 中下载对应架构的 APK
            - update.json 供模块内置更新器使用
          files: |
            artifacts/*.apk
            artifacts/update.json
            artifacts/CHANGELOG.md
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
